name: Release Windows installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag in vYYYY.MM.DD-windows form; existing tags are rejected
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 --no-progress --yes

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Validate release version or resumable draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $metadata = python scripts\release_metadata.py --tag "$env:RELEASE_TAG" --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Release tag is invalid.' }
          $existingRelease = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          $draftExists = $false
          if ($LASTEXITCODE -eq 0) {
            $draftExists = [bool](($existingRelease | ConvertFrom-Json).isDraft)
            if (-not $draftExists) { throw "Release $env:RELEASE_TAG already exists. Published releases are not overwritten." }
          }
          "RELEASE_OUTPUT_VERSION=$($metadata.output_version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_APP_VERSION=$($metadata.app_version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_VERSION_INFO=$($metadata.version_info)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_INSTALLER_NAME=$($metadata.installer_name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_DRAFT_EXISTS=$draftExists" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build bundled YouTube compatibility provider
        shell: pwsh
        run: |
          $providerRoot = Join-Path $env:RUNNER_TEMP 'bgutil-ytdlp-pot-provider'
          $providerCommit = '7608dd51ee813b48cf9a6d68c6e42cb197ce10e0' # 1.3.1
          git init $providerRoot
          git -C $providerRoot remote add origin https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          git -C $providerRoot fetch --depth 1 origin $providerCommit
          git -C $providerRoot checkout --detach FETCH_HEAD
          Push-Location (Join-Path $providerRoot 'server')
          npm ci
          npx tsc --project tsconfig.json
          Pop-Location
          "NANFENG_BGUTIL_BUILD=$providerRoot\server\build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Chocolatey's bin entry is a shim. Bundle the actual FFmpeg binaries,
          # otherwise the installer works only on the build machine.
          $chocolateyRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
          $ffmpegDirectory = Get-ChildItem (Join-Path $chocolateyRoot 'lib') -Directory |
            Where-Object { $_.Name -like 'ffmpeg*' } |
            ForEach-Object { Join-Path $_.FullName 'tools\ffmpeg\bin' } |
            Where-Object { (Test-Path (Join-Path $_ 'ffmpeg.exe')) -and (Test-Path (Join-Path $_ 'ffprobe.exe')) } |
            Select-Object -First 1
          if (-not $ffmpegDirectory) { throw 'Chocolatey FFmpeg binaries were not found.' }
          "NANFENG_FFMPEG_DIR=$ffmpegDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $nodeExecutable = (Get-Command node.exe -ErrorAction Stop).Source
          "NANFENG_NODE_EXE=$nodeExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run tests and build Inno Setup 7 installer
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          $innoInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-7.0.2-x64.exe'
          $innoHash = '5AD54CA3DEF786F8F4212552E54CC6D8D61329E2D24A1CFEE0571D42C2684FF1'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe' -OutFile $innoInstaller
          if ((Get-FileHash $innoInstaller -Algorithm SHA256).Hash -ne $innoHash) { throw 'Inno Setup installer checksum mismatch.' }
          Start-Process -FilePath $innoInstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 7\ISCC.exe','C:\Program Files\Inno Setup 7\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 7 compiler was not found.' }
          python -m PyInstaller --noconfirm --clean .\南枫下载_Windows.spec
          & $iscc.FullName "/DMyAppVersion=$env:RELEASE_APP_VERSION" "/DMyVersionInfo=$env:RELEASE_VERSION_INFO" "/DMyOutputVersion=$env:RELEASE_OUTPUT_VERSION" .\packaging\windows\NanfengDownloader.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          # PyInstaller onedir data files live under _internal. Keep this check
          # aligned with the runtime lookup so a cloud Release cannot omit Node.
          $bundledNode = Get-ChildItem .\dist\南枫下载\_internal\tools\node\node.exe -ErrorAction SilentlyContinue
          if (-not $bundledNode) { throw 'Bundled Node.js runtime is missing.' }
          $bundledFfmpeg = Get-Item .\dist\南枫下载\_internal\tools\ffmpeg\ffmpeg.exe -ErrorAction Stop
          $ffmpegVersion = (& $bundledFfmpeg.FullName -version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg runtime is not executable.' }
          if ($ffmpegVersion -notmatch '^ffmpeg version 9\.0\.1') { throw "Unexpected bundled FFmpeg version: $ffmpegVersion" }

      - name: Publish release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $installer = Get-Item (Join-Path '.\installer\releases' $env:RELEASE_INSTALLER_NAME) -ErrorAction Stop
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          $notes = "Windows 安装包，使用 Inno Setup 7 x64 构建。`n`nSHA-256: ``$hash``"
          if ($env:RELEASE_DRAFT_EXISTS -ne 'True') {
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "南枫下载 Windows $env:RELEASE_TAG" --notes $notes
          }
          gh release upload $env:RELEASE_TAG $installer.FullName
          gh release edit $env:RELEASE_TAG --draft=false --title "南枫下载 Windows $env:RELEASE_TAG" --notes $notes
